[package]
name = "lekhai-python"
description = "Lekhai — Python bindings for the English to Nepali transliteration engine."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "_lekhai"
crate-type = ["cdylib"]

[dependencies]
lekhai = { workspace = true }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"] }
