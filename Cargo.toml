# crates/core owns the decode logic; bindings/python is a thin shim over it.
[workspace]
resolver = "2"
members = ["crates/core", "bindings/python"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/hemantapkh/lekhai"
homepage = "https://github.com/hemantapkh/lekhai"
documentation = "https://docs.rs/lekhai"

[workspace.dependencies]
lekhai = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
